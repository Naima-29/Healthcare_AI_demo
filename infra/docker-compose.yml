# Edge-node dev stack.
#   docker compose -f infra/docker-compose.yml up -d postgres nats          # infra only (tests run against this)
#   python scripts/gen_keys.py && docker compose -f infra/docker-compose.yml up -d --build core   # + the Core service
# Dev-only credentials. Real deployments get secrets from Vault, never from this file.
name: kcd

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kcd
      POSTGRES_PASSWORD: kcd_dev
      POSTGRES_DB: kcd
    ports: ["${KCD_PG_PORT:-5432}:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcd"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

  migrate:                      # one-shot: applies infra/migrations, then exits
    build: {context: .., dockerfile: Dockerfile}
    command: ["python", "-m", "kcd_core.migrate"]
    environment:
      KCD_DATABASE_URL: postgresql://kcd:kcd_dev@postgres:5432/kcd
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  core:
    build: {context: .., dockerfile: Dockerfile}
    environment:
      KCD_ENV: dev
      KCD_DATABASE_URL: postgresql://kcd:kcd_dev@postgres:5432/kcd
      KCD_NATS_URL: nats://nats:4222
      KCD_KEYS_DIR: /keys
      KCD_PAGER: log                 # webhook in staging/prod (see README: Deploying Core)
    volumes: ["../keys:/keys:ro"]    # public keys of every seat; run scripts/gen_keys.py first
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kcd
      MINIO_ROOT_PASSWORD: kcd_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  ollama:
    image: ollama/ollama:0.3.14
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    ports: ["8080:8080"]

  orthanc:
    image: orthancteam/orthanc:24.10.3
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_WEB__ENABLE: "true"
    ports: ["8042:8042"]

volumes:
  pg: {}
  nats: {}
  minio: {}
  ollama: {}
