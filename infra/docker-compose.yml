# Edge-node dev stack. Core code above runs without it (in-memory adapters);
# this is what the Postgres / NATS adapters and other people's MCP servers target next.
# Dev-only credentials. Real deployments get secrets from Vault, never from this file.
name: kcd

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kcd
      POSTGRES_PASSWORD: kcd_dev
      POSTGRES_DB: kcd
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcd"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kcd
      MINIO_ROOT_PASSWORD: kcd_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  ollama:
    image: ollama/ollama:0.3.14
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    ports: ["8080:8080"]

  orthanc:
    image: orthancteam/orthanc:24.10.3
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_WEB__ENABLE: "true"
    ports: ["8042:8042"]

volumes:
  pg: {}
  nats: {}
  minio: {}
  ollama: {}
