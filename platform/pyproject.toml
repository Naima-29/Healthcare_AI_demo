[project]
name = "kcd-platform"
version = "0.2.0"
description = "Kidney Care Desk (Loop AI Labs): Evidence + Database slice on kcd_core, and the evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "kcd-core",                 # the repo root package (core/kcd_core)
    "numpy>=1.26",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
postgres = ["psycopg[binary]>=3.1"]
media = [
    "av==18.1.0",
    "faster-whisper>=1.1",
]
# The browser desk (python -m kcd.web)
web = ["fastapi>=0.162", "starlette>=1.10", "uvicorn>=0.29"]
# Chrislin's CT model (kcd/imaging/chrislin_model.py). CPU torch: --index-url https://download.pytorch.org/whl/cpu
# openvino: optional, about 2x faster on a CPU (kidney finding and classification), same results
ct-model = ["torch>=2.2", "timm>=1.0", "segmentation-models-pytorch>=0.3", "scipy>=1.11", "openvino>=2024.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2"]   # httpx2: what starlette.testclient asks for

[tool.uv.sources]
kcd-core = { path = "..", editable = true }

[tool.ruff]
extend = "../pyproject.toml"    # same lint rules as Core

[tool.ruff.lint.per-file-ignores]
"kcd/web/*" = ["E501"]   # tables of patient-facing wording

[tool.pytest.ini_options]
pythonpath = [".", "../core"]
testpaths = ["tests"]
