[project]
name = "kcd-core"
version = "0.1.0"
description = "Kidney Care Desk core: contracts, seat runtime, policy enforcement, signed A2A bus, dispatcher"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "cryptography>=42",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/kcd_core"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "core"
packages = ["kcd_core"]
plugins = ["pydantic.mypy"]
